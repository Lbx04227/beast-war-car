<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>野兽战车 - Beast War Car</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1208;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #gameContainer {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    background: #2a1f10;
  }
  #hint {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,200,120,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    pointer-events: none;
    z-index: 10;
  }
  canvas { touch-action: none; }

  /* ===== 触屏控件（横屏手机） ===== */
  #touchUI { display: none; position: absolute; inset: 0; z-index: 20; pointer-events: none; touch-action: none; }
  #touchUI.show { display: block; }
  .tbtn {
    pointer-events: auto; position: absolute;
    border: 2px solid rgba(255,200,100,0.4);
    background: rgba(40,26,12,0.6);
    color: #ffcc66;
    font: bold 18px 'Courier New', monospace;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .tbtn.on { background: rgba(255,140,40,0.75); border-color: #ffaa44; }
  #btnA { width: 76px; height: 76px; left: 11%; bottom: 28px; }
  #btnD { width: 76px; height: 76px; left: 23%; bottom: 28px; }
  #btnShift { width: 104px; height: 104px; right: 5%; bottom: 30px; font-size: 20px; }
  #btnFire { width: 82px; height: 82px; right: 18%; bottom: 30px; border-radius: 16px; font-size: 16px; }
  #btnPause { width: 50px; height: 50px; right: 14px; top: 14px; font-size: 20px; }
  #rotateOverlay { display: none; position: absolute; inset: 0; z-index: 40; background: rgba(12,7,2,0.94); align-items: center; justify-content: center; }
  #rotateOverlay.show { display: flex; }
  .ro-icon { font-size: 64px; text-align: center; animation: ro-spin 1.5s linear infinite; }
  .ro-text { margin-top: 18px; color: #ffcc66; font: bold 20px 'Courier New', monospace; text-align: center; line-height: 1.8; letter-spacing: 2px; }
  @keyframes ro-spin { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="hint">自动加速 &nbsp;|&nbsp; A/D 切换车道 &nbsp;|&nbsp; SHIFT 氮气 &nbsp;|&nbsp; SPACE 导弹(BOSS) &nbsp;|&nbsp; P 暂停 &nbsp;|&nbsp; R 重开 &nbsp;|&nbsp; M 静音 &nbsp;|&nbsp; 菜单: ↑↓ 选模式 · ←→ 调时长</div>
  <div id="touchUI">
    <div id="rotateOverlay"><div class="ro-icon">📱</div><div class="ro-text">请横屏游玩<br>旋转手机即可开始</div></div>
    <button class="tbtn" id="btnA">◀</button>
    <button class="tbtn" id="btnD">▶</button>
    <button class="tbtn" id="btnShift">⚡ 氮气</button>
    <button class="tbtn" id="btnFire">⚔ 导弹</button>
    <button class="tbtn" id="btnPause">Ⅱ</button>
  </div>
</div>
<script>
"use strict";

// ============================================================
//  野兽战车 Beast War Car — 第三人称伪3D废土赛车
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const RW = 1280, RH = 720;
canvas.width = RW; canvas.height = RH;

function resizeCanvas() {
  const s = Math.min(window.innerWidth / RW, window.innerHeight / RH);
  canvas.style.width = (RW * s) + 'px';
  canvas.style.height = (RH * s) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
//  常量
// ============================================================
const ROAD_HALF = 1.0;
const LANES = 4;
const LANE_W = (ROAD_HALF * 2) / LANES;
const SEG_LEN = 0.4;
const RENDER_DIST = 120;
const FOV = 78;
const FOCAL = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const HORIZON = RH * 0.12;

const MAX_SPEED = 28;
const NITRO_MAX_SPEED = 48;
const ACCEL = 17.5;   // 普通加速（原 14，+25%）
const NITRO_DRAIN = 11;   // 每秒消耗，越低持续越久（约为原来的 1/2 → 时长 2 倍）
const NITRO_MAX = 100;

// 第三人称俯视相机
const CAM_BEHIND = 1.21;
const CAM_HEIGHT = 1.55;   // 相机升高 → 更俯视的视角
const LANE_SWITCH_COOLDOWN = 0.16;

const CAR_COLORS = ['#c8c8c8','#8a5a3a','#4a6a7a','#7a4a4a','#5a6a4a','#9a8a5a','#6a5a7a'];
const BANDIT_COLORS = ['#2a2a2a','#3a1a1a','#1a2a1a'];

// ============================================================
//  状态
// ============================================================
let gameState = 'menu';
let player = { x: -0.25, z: 0, speed: 0, nitro: 100, nitroActive: false, targetLane: 1, laneCooldown: 0, wheelSpin: 0 };
let traffic = [], pickups = [], particles = [], sandGrains = [];
let score = 0, distance = 0, combo = 0, comboTimer = 0;
let slowTimer = 0, slowFactor = 1;
let shakeX = 0, shakeY = 0, shakeDecay = 0;
let stormIntensity = 0.5, stormTarget = 0.5;
let nitroFlash = 0;
let lastTime = 0, muted = false;

// 游戏模式：endless 无尽 / timed 计时
let gameMode = 'endless';
let timeLimit = 120;              // 计时模式总时长（秒）
let timeLeft = 0;                 // 计时模式剩余时间
let menuMode = 0;                 // 菜单选中：0 无尽 1 计时 2 BOSS
const menuTimes = [60, 120, 180, 300];  // 可选时长 1/2/3/5 分钟
let menuTimeIdx = 1;              // 默认 2 分钟

// BOSS 模式状态
let boss = null, bullets = [], missiles = [], bossDefeated = false, missileCooldown = 0;
let missileStock = 0, fireQueued = false;   // 导弹库存（捡箱 +3，空格消耗 1）与按键边沿触发
let beams = [], stageBanner = 0;            // 激光封锁柱 / 第二关过渡横幅
let shield = 0;            // 护盾层数（挡一次伤害）/ 时间减缓剩余秒

// 相机
let camX = 0, camY = CAM_HEIGHT, camZ = -CAM_BEHIND;

// ============================================================
//  输入
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && gameState === 'playing') gameState = 'paused';
  else if (e.code === 'KeyP' && gameState === 'paused') gameState = 'playing';
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyR' && gameState === 'playing') initGame();

  // 菜单：↑/↓ 选择模式，←/→ 调整计时时长
  if (gameState === 'menu') {
    if (e.code === 'ArrowUp') menuMode = (menuMode + 2) % 3;
    else if (e.code === 'ArrowDown') menuMode = (menuMode + 1) % 3;
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      if (menuMode === 1) menuTimeIdx = (menuTimeIdx + menuTimes.length - 1) % menuTimes.length;
    }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      if (menuMode === 1) menuTimeIdx = (menuTimeIdx + 1) % menuTimes.length;
    }
  }

  if (e.code === 'Space' || e.code === 'Enter') {
    if (gameState === 'menu' || gameState === 'gameover') startGame();
    else if (gameState === 'playing' && e.code === 'Space') fireQueued = true;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ============================================================
//  触屏支持（横屏手机：屏幕虚拟按键 + 菜单点按）
// ============================================================
const isTouch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const touchUI = document.getElementById('touchUI');
const rotateOverlay = document.getElementById('rotateOverlay');

function applyTouchUI() {
  const portrait = window.innerHeight > window.innerWidth;
  rotateOverlay.classList.toggle('show', isTouch && portrait);
  touchUI.classList.toggle('show', isTouch && !portrait);
}
window.addEventListener('resize', applyTouchUI);
window.addEventListener('orientationchange', applyTouchUI);

function bindTouchBtn(id, code) {
  const el = document.getElementById(id);
  if (!el) return;
  const down = e => { e.preventDefault(); keys[code] = true; el.classList.add('on'); };
  const up = e => { e.preventDefault(); keys[code] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
bindTouchBtn('btnA', 'KeyA');
bindTouchBtn('btnD', 'KeyD');
bindTouchBtn('btnShift', 'ShiftLeft');
document.getElementById('btnPause').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (gameState === 'playing') gameState = 'paused';
  else if (gameState === 'paused') gameState = 'playing';
});
// 导弹按钮：按一下发一发（边沿触发，避免长按连发）
const btnFireEl = document.getElementById('btnFire');
btnFireEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (gameState === 'playing') fireQueued = true;
  btnFireEl.classList.add('on');
});
btnFireEl.addEventListener('pointerup', () => btnFireEl.classList.remove('on'));
btnFireEl.addEventListener('pointercancel', () => btnFireEl.classList.remove('on'));

// 菜单/结算触控点按（选模式、调时长、开始/重开）
canvas.addEventListener('pointerup', e => {
  if (!isTouch) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * RW;
  const y = (e.clientY - rect.top) / rect.height * RH;
  if (gameState === 'menu') {
    for (let i = 0; i < 3; i++) {
      const cy = RH * 0.435 + i * 34;
      if (y > cy - 16 && y < cy + 16) { menuMode = i; return; }
    }
    if (menuMode === 1 && y > RH * 0.545 && y < RH * 0.62) { menuTimeIdx = (menuTimeIdx + 1) % menuTimes.length; return; }
    if (y > RH * 0.75) { startGame(); return; }
  } else if (gameState === 'gameover') {
    if (y > RH * 0.55) startGame();
  } else if (gameState === 'paused') {
    gameState = 'playing';
  }
});

// ============================================================
//  音频
// ============================================================
let audioCtx = null, engineOsc = null, engineGain = null, engineFilter = null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 60;
    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 300;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
  } catch(e) {}
}
function playBoom() {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.5);
  const bufSize = audioCtx.sampleRate * 0.3;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.3;
  src.connect(ng); ng.connect(audioCtx.destination);
  src.start(t);
}
function playNitro() {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(800, t + 0.3);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.4);
}
function playPickup() {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  [660, 880, 1100].forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.08, t + i*0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.06 + 0.1);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t + i*0.06); osc.stop(t + i*0.06 + 0.12);
  });
}
function playShoot() {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(220, t + 0.15);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.2);
}
function updateEngineSound() {
  if (!audioCtx || !engineGain) return;
  const speedRatio = player.speed / NITRO_MAX_SPEED;
  const targetFreq = 50 + speedRatio * 180 + (player.nitroActive ? 40 : 0);
  engineOsc.frequency.value += (targetFreq - engineOsc.frequency.value) * 0.1;
  engineFilter.frequency.value = 200 + speedRatio * 600;
  engineGain.gain.value = muted ? 0 : (gameState === 'playing' ? 0.06 + speedRatio * 0.06 : 0);
}

// ============================================================
//  工具
// ============================================================
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b+1)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// 伪3D投影：绝对世界坐标 → 屏幕坐标
function project(worldX, worldY, worldZ) {
  const dz = worldZ - camZ;
  if (dz <= 0.1) return null;
  const nx = (worldX - camX) / ROAD_HALF;
  const scale = FOCAL / dz;
  return {
    x: RW / 2 + (RW / 2) * scale * nx,
    y: HORIZON + (RH / 2) * scale * (camY - worldY),
    scale: scale
  };
}

function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  return `rgb(${Math.round(lerp(r1,r2,t))},${Math.round(lerp(g1,g2,t))},${Math.round(lerp(b1,b2,t))})`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function shadeColor(hex, amt) {
  const r = clamp(parseInt(hex.slice(1,3),16)+amt, 0, 255);
  const g = clamp(parseInt(hex.slice(3,5),16)+amt, 0, 255);
  const b = clamp(parseInt(hex.slice(5,7),16)+amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
//  初始化
// ============================================================
function startGame() {
  gameMode = menuMode === 1 ? 'timed' : (menuMode === 2 ? 'boss' : 'endless');
  timeLimit = menuTimes[menuTimeIdx];
  initGame();
}

function initGame() {
  initAudio();
  player = { x: -0.25, z: 0, speed: 0, nitro: NITRO_MAX, nitroActive: false, targetLane: 1, laneCooldown: 0, wheelSpin: 0, hp: 3, invuln: 0, prevLane: 1, laneGrace: 0 };
  timeLeft = gameMode === 'timed' ? timeLimit : 0;
  camX = player.x; camY = CAM_HEIGHT; camZ = player.z - CAM_BEHIND;
  traffic = []; pickups = []; particles = [];
  bullets = []; missiles = []; missileCooldown = 0; bossDefeated = false;
  missileStock = 0; fireQueued = false;
  beams = []; stageBanner = 0;
  shield = 0;
  if (gameMode === 'boss') startBossStage(1); else boss = null;
  score = 0; distance = 0; combo = 0; comboTimer = 0;
  slowTimer = 0; slowFactor = 1;
  shakeX = 0; shakeY = 0; shakeDecay = 0;
  stormIntensity = 0.5; stormTarget = 0.5; nitroFlash = 0;
  gameState = 'playing';
  if (gameMode !== 'boss') for (let i = 0; i < 10; i++) spawnTraffic(rand(8, 80));
  for (let i = 0; i < 4; i++) spawnPickup(rand(10, 70));
  if (gameMode === 'boss') for (let i = 0; i < 3; i++) spawnPickup(rand(15, 55));
  sandGrains = [];
  for (let i = 0; i < 120; i++) {
    sandGrains.push({ x: rand(0, RW), y: rand(0, RH), vx: rand(-200, -60), vy: rand(-20, 20), size: rand(1, 3), alpha: rand(0.1, 0.4) });
  }
}

// ============================================================
//  生成
// ============================================================
function startBossStage(stage) {
  const s2 = stage === 2;
  boss = {
    x: 0, z: player.z + 24,
    hp: s2 ? 80 : 40, maxHp: s2 ? 80 : 40,
    fireTimer: s2 ? 1.8 : 1.6,
    speed: 0, wob: rand(0, 6), flash: 0,
    aimLanes: [], warnTimer: 0,
    stage: stage, sizeMul: s2 ? 1.25 : 1,
    chase: s2 ? 0.88 : 0.78, steer: s2 ? 0.26 : 0.18,
    warnTime: s2 ? 0.55 : 0.7,
    beamTimer: s2 ? 3.5 : 999
  };
}

function spawnTraffic(z) {
  const isBandit = Math.random() < 0.3 && gameMode !== 'boss';
  const lane = randInt(0, LANES - 1);
  traffic.push({
    x: -ROAD_HALF + LANE_W * (lane + 0.5),
    z: z !== undefined ? player.z + z : player.z + rand(30, 90),
    speed: isBandit ? rand(10, 16) : rand(6, 12),
    color: isBandit ? pick(BANDIT_COLORS) : pick(CAR_COLORS),
    isBandit: isBandit,
    dropTimer: rand(1, 3),
    wobble: rand(0, Math.PI * 2),
    rammed: false,
    ramVel: { x: 0, y: 0, rot: 0 },
    rot: 0,
    y: 0
  });
}

function spawnPickup(z) {
  const r = Math.random();
  let type;
  if (gameMode === 'boss') type = r < 0.3 ? 'nitro' : (r < 0.5 ? 'ammo' : (r < 0.68 ? 'shield' : (r < 0.82 ? 'medkit' : (r < 0.94 ? 'spike' : 'fire'))));
  else type = r < 0.5 ? 'nitro' : (r < 0.75 ? 'spike' : 'fire');
  const lane = randInt(0, LANES - 1);
  // 最小生成距离 ≈ 车速 × 1.1 秒，避免"突然出现"
  const lead = clamp(player.speed * 1.1, 20, 60);
  pickups.push({
    x: -ROAD_HALF + LANE_W * (lane + 0.5),
    z: z !== undefined ? player.z + z : player.z + rand(lead, lead + 30),
    type: type,
    life: type === 'fire' ? 8 : (type === 'spike' ? 12 : 999),
    flicker: rand(0, Math.PI * 2)
  });
}

function banditDrop(car) {
  pickups.push({
    x: car.x + rand(-0.1, 0.1),
    z: car.z - 1.5,
    type: Math.random() < 0.5 ? 'spike' : 'fire',
    life: Math.random() < 0.5 ? 12 : 6,
    flicker: 0
  });
}

// ============================================================
//  粒子
// ============================================================
function spawnExplosion(x, z, big) {
  const count = big ? 40 : 20;
  for (let i = 0; i < count; i++) {
    const ang = rand(0, Math.PI * 2);
    const spd = rand(2, big ? 12 : 7);
    particles.push({
      x: x, y: rand(0.1, 0.5), z: z,
      vx: Math.cos(ang) * spd, vy: rand(2, 8), vz: Math.sin(ang) * spd,
      life: rand(0.5, 1.2), maxLife: 1.2,
      size: rand(3, big ? 12 : 7),
      color: pick(['#ff6b1a','#ffaa00','#ff3300','#ffdd44','#888888']),
      type: 'spark'
    });
  }
  for (let i = 0; i < (big ? 15 : 8); i++) {
    particles.push({
      x: x + rand(-0.2,0.2), y: rand(0.2,0.6), z: z + rand(-0.3,0.3),
      vx: rand(-1,1), vy: rand(1,3), vz: rand(-1,1),
      life: rand(1, 2), maxLife: 2, size: rand(10, 25),
      color: '#554433', type: 'smoke'
    });
  }
}

function spawnDust() {
  if (Math.random() < 0.4 && player.speed > 5) {
    particles.push({
      x: player.x + rand(-0.3, 0.3), y: 0.05, z: player.z - 0.8,
      vx: rand(-0.5, 0.5), vy: rand(0.5, 2), vz: rand(-3, -1),
      life: rand(0.4, 0.8), maxLife: 0.8,
      size: rand(8, 18), color: '#c9a86c', type: 'dust'
    });
  }
  // 排气管黑烟
  if (Math.random() < 0.2) {
    particles.push({
      x: player.x + rand(-0.2, 0.2), y: rand(0.2, 0.4), z: player.z - 0.5,
      vx: rand(-0.3, 0.3), vy: rand(0.5, 1.5), vz: rand(-2, -1),
      life: rand(0.6, 1.2), maxLife: 1.2,
      size: rand(6, 14), color: '#333', type: 'smoke'
    });
  }
}

function spawnNitroFlames() {
  if (!player.nitroActive) return;
  if (Math.random() < 0.9) {
    for (let ex = -1; ex <= 1; ex += 2) {
      particles.push({
        x: player.x + ex * 0.245 + rand(-0.05, 0.05),
        y: rand(0.15, 0.55),
        z: player.z - rand(0.2, 0.7),
        vx: rand(-0.6, 0.6), vy: rand(2, 5), vz: rand(-3, -1.5),
        life: rand(0.18, 0.4), maxLife: 0.4,
        size: rand(5, 12),
        color: pick(['#ffdd44', '#ff9922', '#ff5500', '#fff3b0']),
        type: 'flame'
      });
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.type === 'spark') p.vy -= 15 * dt;
    if (p.type === 'smoke' || p.type === 'dust') p.size += 15 * dt;
  }
}

// ============================================================
//  更新
// ============================================================
function update(dt) {
  if (gameState !== 'playing') return;

  const left = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];
  const nitroKey = keys['ShiftLeft'] || keys['ShiftRight'];

  // 氮气
  const nitroWasActive = player.nitroActive;
  player.nitroActive = nitroKey && player.nitro > 0 && player.speed > 3;
  if (player.nitroActive) {
    player.nitro -= NITRO_DRAIN * dt;
    if (player.nitro <= 0) { player.nitro = 0; player.nitroActive = false; }
    nitroFlash = 1;
    spawnNitroFlames();
    // 氮气冲击：激活瞬间提速一截 + 震动 + 火焰爆发
    if (!nitroWasActive) {
      player.speed += 6;
      shakeDecay = Math.max(shakeDecay, 0.3);
      for (let i = 0; i < 14; i++) {
        particles.push({
          x: player.x + rand(-0.5, 0.5), y: rand(0.1, 0.6), z: player.z - rand(0.1, 0.8),
          vx: rand(-2, 2), vy: rand(2, 6), vz: rand(-4, -1),
          life: rand(0.3, 0.6), maxLife: 0.6,
          size: rand(4, 10),
          color: pick(['#ffdd44', '#ff9922', '#ff5500', '#fff3b0']),
          type: 'flame'
        });
      }
      playNitro();
    } else {
      shakeDecay = Math.max(shakeDecay, 0.05);  // 持续轻微震动
    }
  } else {
    nitroFlash = Math.max(0, nitroFlash - dt * 2);
  }

  // 导弹发射（BOSS 模式）：按一下发一发，消耗导弹库存；库存 0 时按空格不发射
  missileCooldown -= dt;
  if (fireQueued) {
    fireQueued = false;
    if (gameMode === 'boss' && missileStock > 0 && missileCooldown <= 0 && missiles.length < 9) {
      missiles.push({ x: player.x, z: player.z + 1.4 });
      missileStock--;
      missileCooldown = 0.35;
      playShoot();
    }
  }

  // 加减速（自动加速，无需按键）
  const currentMax = player.nitroActive ? NITRO_MAX_SPEED : MAX_SPEED;
  const currentAccel = player.nitroActive ? ACCEL * 2.6 : ACCEL;
  player.speed += currentAccel * dt;
  player.speed = clamp(player.speed, 0, currentMax);

  // 减速效果
  if (slowTimer > 0) {
    slowTimer -= dt;
    player.speed *= (1 - (1 - slowFactor) * dt * 3);
    if (slowTimer <= 0) slowFactor = 1;
  }

  // === 车道切换（带换道保护） ===
  if (player.laneCooldown > 0) player.laneCooldown -= dt;
  if (left && player.laneCooldown <= 0 && player.targetLane > 0) {
    player.prevLane = player.targetLane;
    player.targetLane--;
    player.laneCooldown = LANE_SWITCH_COOLDOWN;
    player.laneGrace = 0.28;   // 保护窗口：刚离开的车道不判陷阱
  }
  if (right && player.laneCooldown <= 0 && player.targetLane < LANES - 1) {
    player.prevLane = player.targetLane;
    player.targetLane++;
    player.laneCooldown = LANE_SWITCH_COOLDOWN;
    player.laneGrace = 0.28;
  }
  if (player.laneGrace > 0) player.laneGrace -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  const targetX = -ROAD_HALF + LANE_W * (player.targetLane + 0.5);
  player.x = lerp(player.x, targetX, dt * 10);

  // 前进
  const effectiveSpeed = player.speed * (slowTimer > 0 ? 0.6 : 1);
  player.z += effectiveSpeed * dt;
  distance += effectiveSpeed * dt;
  score += effectiveSpeed * dt * 2;
  player.wheelSpin += effectiveSpeed * dt * 8;

  // 连击
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // 屏幕震动
  if (shakeDecay > 0) {
    shakeDecay -= dt;
    shakeX = rand(-1, 1) * shakeDecay * 8;
    shakeY = rand(-1, 1) * shakeDecay * 8;
    if (shakeDecay <= 0) { shakeX = 0; shakeY = 0; }
  }

  // 沙尘暴
  if (Math.random() < 0.005) stormTarget = rand(0.3, 0.85);
  stormIntensity = lerp(stormIntensity, stormTarget, dt * 0.3);

  // 扬尘
  spawnDust();

  // === 相机跟随（第三人称俯视）===
  camX = lerp(camX, player.x, dt * 4);
  camZ = player.z - CAM_BEHIND;
  camY = CAM_HEIGHT + (player.nitroActive ? -0.2 : 0) + Math.sin(player.wheelSpin * 0.2) * 0.03;

  // === 交通 ===
  for (let i = traffic.length - 1; i >= 0; i--) {
    const car = traffic[i];
    car.wobble += dt * 3;
    if (car.rammed) {
      car.ramVel.y -= 20 * dt;
      car.y += car.ramVel.y * dt;
      car.x += car.ramVel.x * dt;
      car.z += car.ramVel.z * dt + effectiveSpeed * dt * 0.3;
      car.rot += car.ramVel.rot * dt;
      car.ramVel.x *= 0.98;
      if (car.z < player.z - 8 || car.y < -3) { traffic.splice(i, 1); continue; }
    } else {
      car.z += car.speed * dt;
      if (car.isBandit) {
        car.dropTimer -= dt;
        if (car.dropTimer <= 0 && car.z - player.z > 6 && car.z - player.z < 60) {
          banditDrop(car);
          car.dropTimer = rand(2, 4);
        }
      }
    }
    if (car.z < player.z - 8) traffic.splice(i, 1);
  }

  const targetCars = gameMode === 'boss' ? 0 : 10 + Math.floor(player.speed / 5);
  if (traffic.filter(c => !c.rammed).length < targetCars && Math.random() < 0.04) spawnTraffic();

  // === 道具 ===
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.flicker += dt * 8;
    if (p.type !== 'nitro') {
      p.life -= dt;
      if (p.life <= 0) { pickups.splice(i, 1); continue; }
    }
    if (p.z < player.z - 5) pickups.splice(i, 1);
  }
  if (Math.random() < 0.008) {
    if (gameMode === 'boss') {
      if (pickups.filter(p => p.type === 'nitro').length < 2) spawnPickup();
      if (pickups.filter(p => p.type === 'ammo').length < 2) spawnPickup();
    } else if (pickups.filter(p => p.type === 'nitro').length < 3) spawnPickup();
  }

  // === BOSS 战 ===
  if (gameMode === 'boss') {
    if (stageBanner > 0) {
      stageBanner -= dt;
      if (stageBanner <= 0 && !boss) startBossStage(2);
    }
    updateBoss(dt);
  }

  // === 碰撞 ===
  checkCollisions();

  // === 粒子 ===
  updateParticles(dt);

  // === 沙尘 ===
  for (const g of sandGrains) {
    g.x += (g.vx - player.speed * 5) * dt * stormIntensity;
    g.y += g.vy * dt;
    if (g.x < -10) { g.x = RW + 10; g.y = rand(0, RH); }
    if (g.y < 0 || g.y > RH) g.y = rand(0, RH);
  }

  // 计时模式倒计时
  if (gameMode === 'timed') {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameState = 'gameover';
    }
  }

  updateEngineSound();
}

function checkCollisions() {
  for (const car of traffic) {
    if (car.rammed) continue;
    const dz = car.z - player.z;
    const dx = car.x - player.x;
    if (dz > -0.8 && dz < 1.2 && Math.abs(dx) < 0.45) {
      car.rammed = true;
      const dir = dx > 0 ? 1 : -1;
      car.ramVel = { x: dir * rand(4, 8) + player.speed * 0.1, y: rand(6, 12), z: rand(-2, 2), rot: dir * rand(8, 15) };
      car.y = 0;
      spawnExplosion(car.x, car.z, true);
      playBoom();
      shakeDecay = 0.4;
      combo++;
      comboTimer = 2.5;
      const bonus = 100 * combo;
      score += bonus;
      particles.push({ x: car.x, y: 0.8, z: car.z, vx: 0, vy: 3, vz: 0, life: 1, maxLife: 1, size: 0, color: '#ffdd44', type: 'text', text: '+' + bonus });
    }
  }

  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    const dz = p.z - player.z;
    const dx = p.x - player.x;
    // 换道保护：刚离开的车道 0.28s 内不判陷阱
    if (player.laneGrace > 0 && Math.abs(p.x - (-ROAD_HALF + LANE_W * (player.prevLane + 0.5))) < 0.3) continue;
    // 判定盒：陷阱按视觉 65% 收紧，避免"看着没撞上却扣血"
    let hdx, hz1, hz2;
    if (p.type === 'nitro') { hdx = 0.38; hz1 = -0.5; hz2 = 0.8; }
    else if (p.type === 'spike') { hdx = 0.26; hz1 = -0.3; hz2 = 0.4; }
    else if (p.type === 'fire') { hdx = 0.28; hz1 = -0.45; hz2 = 0.4; }
    else { hdx = 0.34; hz1 = -0.5; hz2 = 0.6; }   // ammo 导弹箱
    if (dz > hz1 && dz < hz2 && Math.abs(dx) < hdx) {
      if (p.type === 'nitro') {
        player.nitro = clamp(player.nitro + 45, 0, NITRO_MAX);
        playPickup();
        score += 50;
        pickups.splice(i, 1);
        for (let j = 0; j < 12; j++) {
          particles.push({ x: p.x, y: rand(0.1,0.4), z: p.z, vx: rand(-2,2), vy: rand(2,5), vz: rand(-2,2), life: 0.6, maxLife: 0.6, size: rand(3,6), color: '#ff8800', type: 'spark' });
        }
      } else if (p.type === 'spike') {
        slowTimer = 1.5; slowFactor = 0.4; shakeDecay = 0.2; playBoom();
        pickups.splice(i, 1);
      } else if (p.type === 'fire') {
        slowTimer = 2; slowFactor = 0.5; shakeDecay = 0.15;
        pickups.splice(i, 1);
      } else if (p.type === 'ammo') {
        missileStock = Math.min(9, missileStock + 3);
        playPickup(); score += 50;
        pickups.splice(i, 1);
        particles.push({ x: p.x, y: 0.8, z: p.z, vx: 0, vy: 3, vz: 0, life: 1, maxLife: 1, size: 0, color: '#88ff88', type: 'text', text: '+3 导弹' });
      } else if (p.type === 'shield') {
        shield = Math.min(2, shield + 1);
        playPickup(); score += 50;
        pickups.splice(i, 1);
        for (let j = 0; j < 10; j++) {
          particles.push({ x: p.x, y: rand(0.2, 0.8), z: p.z, vx: rand(-2, 2), vy: rand(2, 5), vz: rand(-2, 2), life: 0.6, maxLife: 0.6, size: rand(3, 6), color: '#66ccff', type: 'spark' });
        }
        particles.push({ x: p.x, y: 0.8, z: p.z, vx: 0, vy: 3, vz: 0, life: 1, maxLife: 1, size: 0, color: '#aaddff', type: 'text', text: '+护盾' });
      } else if (p.type === 'medkit') {
        if (player.hp < 3) player.hp++;
        playPickup(); score += 100;
        pickups.splice(i, 1);
        particles.push({ x: p.x, y: 0.8, z: p.z, vx: 0, vy: 3, vz: 0, life: 1, maxLife: 1, size: 0, color: '#ff8888', type: 'text', text: '+1 生命' });
      }
    }
  }
}

// ============================================================
//  渲染：天空
// ============================================================
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, HORIZON + 20);
  grad.addColorStop(0, '#4a3520');
  grad.addColorStop(0.4, '#8a6535');
  grad.addColorStop(0.7, '#b89050');
  grad.addColorStop(1, '#d4a868');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, RW, HORIZON + 20);

  const sunX = RW * 0.7, sunY = HORIZON * 0.5;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 120);
  sunGrad.addColorStop(0, 'rgba(255,200,100,0.6)');
  sunGrad.addColorStop(0.3, 'rgba(255,170,60,0.3)');
  sunGrad.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(sunX - 130, sunY - 130, 260, 260);

  // 废墟天际线
  ctx.fillStyle = 'rgba(60,40,25,0.7)';
  const seed = Math.floor(player.z / 20);
  for (let i = 0; i < 18; i++) {
    const pseudo = Math.sin(seed * 13.7 + i * 7.3) * 0.5 + 0.5;
    const bx = (i / 18) * RW + pseudo * 40 - 20;
    const bh = 20 + pseudo * 60;
    const bw = 30 + pseudo * 50;
    ctx.fillRect(bx, HORIZON - bh, bw, bh);
    if (pseudo > 0.5) {
      ctx.fillStyle = 'rgba(74,53,32,1)';
      ctx.fillRect(bx + bw * 0.3, HORIZON - bh, bw * 0.2, bh * 0.3);
      ctx.fillStyle = 'rgba(60,40,25,0.7)';
    }
  }

  const fogGrad = ctx.createLinearGradient(0, HORIZON - 40, 0, HORIZON + 10);
  fogGrad.addColorStop(0, 'rgba(201,168,108,0)');
  fogGrad.addColorStop(1, 'rgba(201,168,108,' + (0.3 + stormIntensity * 0.3) + ')');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, HORIZON - 40, RW, 50);
}

// ============================================================
//  渲染：地面
// ============================================================
function drawGround() {
  const grad = ctx.createLinearGradient(0, HORIZON, 0, RH);
  grad.addColorStop(0, '#b89050');
  grad.addColorStop(0.3, '#a07840');
  grad.addColorStop(1, '#8a6530');
  ctx.fillStyle = grad;
  ctx.fillRect(0, HORIZON, RW, RH - HORIZON);

  ctx.fillStyle = 'rgba(120,90,50,0.15)';
  const gSeed = Math.floor(player.z / 2);
  for (let i = 0; i < 30; i++) {
    const pseudo = Math.sin(gSeed * 5.1 + i * 3.7) * 0.5 + 0.5;
    const gy = HORIZON + pseudo * (RH - HORIZON);
    const gx = (i * 137 + gSeed * 23) % RW;
    ctx.beginPath();
    ctx.ellipse(gx, gy, 20 + pseudo * 40, 5 + pseudo * 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
//  渲染：公路
// ============================================================
function drawRoad() {
  const startZ = camZ + 0.2;
  const endZ = camZ + RENDER_DIST;
  const segs = [];
  for (let z = startZ; z < endZ; z += SEG_LEN) segs.push(z);

  for (let i = segs.length - 1; i >= 0; i--) {
    const z1 = segs[i];
    const z2 = Math.min(z1 + SEG_LEN, endZ);
    const p1l = project(-ROAD_HALF, 0, z1);
    const p1r = project(ROAD_HALF, 0, z1);
    const p2l = project(-ROAD_HALF, 0, z2);
    const p2r = project(ROAD_HALF, 0, z2);
    if (!p1l || !p2l) continue;

    const fog = clamp((z1 - camZ) / RENDER_DIST, 0, 1);
    const roadColor = lerpColor('#3a3530', '#8a7050', fog * 0.6 + stormIntensity * 0.2);

    ctx.fillStyle = roadColor;
    ctx.beginPath();
    ctx.moveTo(p1l.x, p1l.y); ctx.lineTo(p1r.x, p1r.y);
    ctx.lineTo(p2r.x, p2r.y); ctx.lineTo(p2l.x, p2l.y);
    ctx.closePath(); ctx.fill();

    // 路肩
    const shoulderW = 0.08;
    const sl1 = project(-ROAD_HALF - shoulderW, 0, z1);
    const sr1 = project(ROAD_HALF + shoulderW, 0, z1);
    const sl2 = project(-ROAD_HALF - shoulderW, 0, z2);
    const sr2 = project(ROAD_HALF + shoulderW, 0, z2);
    if (sl1 && sl2) {
      ctx.fillStyle = lerpColor('#9a7840', '#b89050', fog);
      ctx.beginPath();
      ctx.moveTo(sl1.x, sl1.y); ctx.lineTo(p1l.x, p1l.y);
      ctx.lineTo(p2l.x, p2l.y); ctx.lineTo(sl2.x, sl2.y);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(p1r.x, p1r.y); ctx.lineTo(sr1.x, sr1.y);
      ctx.lineTo(sr2.x, sr2.y); ctx.lineTo(p2r.x, p2r.y);
      ctx.closePath(); ctx.fill();
    }

    // 车道线
    const segIndex = Math.floor(z1 / SEG_LEN);
    if (segIndex % 2 === 0) {
      ctx.strokeStyle = 'rgba(220,210,190,' + (0.5 - fog * 0.4) + ')';
      ctx.lineWidth = Math.max(1, 3 * p1l.scale);
      for (let lane = 1; lane < LANES; lane++) {
        const lx = -ROAD_HALF + lane * LANE_W;
        const lp1 = project(lx, 0, z1);
        const lp2 = project(lx, 0, z2);
        if (lp1 && lp2) {
          ctx.beginPath(); ctx.moveTo(lp1.x, lp1.y); ctx.lineTo(lp2.x, lp2.y); ctx.stroke();
        }
      }
    }
  }
}

// ============================================================
//  渲染：路边物体
// ============================================================
function drawRoadsideObjects() {
  const objSeed = Math.floor(player.z / 3);
  for (let i = 0; i < 20; i++) {
    const pseudo = Math.sin(objSeed * 9.1 + i * 5.7) * 0.5 + 0.5;
    const worldZ = player.z + 2 + i * 4 + pseudo * 2;
    if (worldZ - camZ > RENDER_DIST) continue;
    const side = i % 2 === 0 ? -1 : 1;
    const ox = side * (ROAD_HALF + 0.5 + pseudo * 2);
    const p = project(ox, 0, worldZ);
    if (!p) continue;
    const size = p.scale * 80;

    if (pseudo < 0.3) {
      ctx.fillStyle = '#4a6a3a';
      ctx.fillRect(p.x - size*0.08, p.y - size*0.6, size*0.16, size*0.6);
      ctx.fillRect(p.x - size*0.25, p.y - size*0.45, size*0.12, size*0.3);
      ctx.fillRect(p.x + size*0.13, p.y - size*0.5, size*0.12, size*0.35);
    } else if (pseudo < 0.55) {
      ctx.fillStyle = '#6a5540';
      ctx.beginPath(); ctx.ellipse(p.x, p.y - size*0.15, size*0.3, size*0.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7a6550';
      ctx.beginPath(); ctx.ellipse(p.x - size*0.1, p.y - size*0.2, size*0.15, size*0.1, 0, 0, Math.PI*2); ctx.fill();
    } else if (pseudo < 0.75) {
      ctx.fillStyle = '#5a4530';
      ctx.fillRect(p.x - size*0.25, p.y - size*0.4, size*0.5, size*0.4);
      ctx.fillStyle = '#4a3520';
      ctx.fillRect(p.x - size*0.15, p.y - size*0.55, size*0.15, size*0.25);
    } else {
      ctx.fillStyle = '#5a4a3a';
      ctx.fillRect(p.x - size*0.3, p.y - size*0.15, size*0.6, size*0.15);
      ctx.fillStyle = '#4a3a2a';
      ctx.fillRect(p.x - size*0.15, p.y - size*0.28, size*0.3, size*0.15);
    }
  }
}

// ============================================================
//  渲染：交通车辆
// ============================================================
function drawTraffic() {
  const sorted = traffic.slice().sort((a, b) => b.z - a.z);
  for (const car of sorted) {
    const dz = car.z - player.z;
    if (dz < -2 || dz > RENDER_DIST) continue;
    const p = project(car.x, car.y, car.z);
    if (!p) continue;

    const w = p.scale * 280;
    const h = p.scale * 175;
    const y = p.y;

    ctx.save();
    ctx.translate(p.x, y);
    if (car.rammed) {
      ctx.rotate(car.rot);
      ctx.translate(0, -car.y * p.scale * 100);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 5, w*0.45, h*0.12, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = car.color;
    roundRect(ctx, -w*0.4, -h*0.55, w*0.8, h*0.5, w*0.08); ctx.fill();

    ctx.fillStyle = shadeColor(car.color, -20);
    roundRect(ctx, -w*0.25, -h*0.8, w*0.5, h*0.3, w*0.06); ctx.fill();

    ctx.fillStyle = 'rgba(150,180,200,0.5)';
    roundRect(ctx, -w*0.2, -h*0.75, w*0.4, h*0.18, w*0.04); ctx.fill();

    ctx.fillStyle = car.isBandit ? '#ff3300' : '#ffee88';
    ctx.fillRect(-w*0.35, -h*0.35, w*0.1, h*0.08);
    ctx.fillRect(w*0.25, -h*0.35, w*0.1, h*0.08);

    if (car.isBandit) {
      ctx.fillStyle = '#888';
      for (let s = -2; s <= 2; s++) {
        ctx.beginPath();
        ctx.moveTo(s * w*0.12, -h*0.55);
        ctx.lineTo(s * w*0.12 - w*0.04, -h*0.7);
        ctx.lineTo(s * w*0.12 + w*0.04, -h*0.7);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#333';
      ctx.fillRect(-w*0.2, -h*0.88, w*0.4, h*0.06);
    }

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-w*0.38, -h*0.12, w*0.14, h*0.15);
    ctx.fillRect(w*0.24, -h*0.12, w*0.14, h*0.15);

    ctx.restore();
  }
}

// ============================================================
//  渲染：玩家战车（第三人称车尾）
// ============================================================
function drawPlayerCar() {
  const p = project(player.x, 0, player.z);
  if (!p) return;

  const s = p.scale;
  const cx = p.x;
  const cy = p.y;
  const cw = s * 160;  // 半宽（比车道略小，车道可见更宽）
  const ch = s * 115;  // 总高

  ctx.save();
  ctx.translate(cx, cy);

  // 车身倾斜（随切道轻微倾斜）
  const tilt = (player.x - (-ROAD_HALF + LANE_W * (player.targetLane + 0.5))) * 0.15;
  ctx.rotate(tilt * 0.3);

  // === 阴影 ===
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 8, cw * 1.15, ch * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();

  // === 后轮（从车尾可见）===
  const tireW = cw * 0.28;
  const tireH = ch * 0.42;
  // 左后轮
  ctx.fillStyle = '#111';
  roundRect(ctx, -cw * 1.0, -tireH, tireW, tireH, tireW * 0.15); ctx.fill();
  // 右后轮
  roundRect(ctx, cw * 0.72, -tireH, tireW, tireH, tireW * 0.15); ctx.fill();
  // 轮毂（带旋转）
  ctx.save();
  ctx.translate(-cw * 0.86, -tireH * 0.5);
  ctx.rotate(player.wheelSpin);
  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.arc(0, 0, tireW * 0.35, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  for (let sp = 0; sp < 5; sp++) {
    ctx.save();
    ctx.rotate(sp * Math.PI * 2 / 5);
    ctx.fillRect(-tireW*0.04, -tireW*0.35, tireW*0.08, tireW*0.7);
    ctx.restore();
  }
  ctx.restore();
  ctx.save();
  ctx.translate(cw * 0.86, -tireH * 0.5);
  ctx.rotate(player.wheelSpin);
  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.arc(0, 0, tireW * 0.35, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  for (let sp = 0; sp < 5; sp++) {
    ctx.save();
    ctx.rotate(sp * Math.PI * 2 / 5);
    ctx.fillRect(-tireW*0.04, -tireW*0.35, tireW*0.08, tireW*0.7);
    ctx.restore();
  }
  ctx.restore();

  // === 主车身（车尾）===
  const bodyGrad = ctx.createLinearGradient(-cw, -ch, cw, 0);
  bodyGrad.addColorStop(0, '#4a1f10');
  bodyGrad.addColorStop(0.25, '#6a2d18');
  bodyGrad.addColorStop(0.5, '#7a3520');
  bodyGrad.addColorStop(0.75, '#5a2515');
  bodyGrad.addColorStop(1, '#3a1808');
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, -cw * 0.88, -ch * 0.82, cw * 1.76, ch * 0.82, cw * 0.1);
  ctx.fill();

  // 车身装甲板拼接线
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = Math.max(1, s * 3);
  ctx.beginPath();
  ctx.moveTo(-cw * 0.3, -ch * 0.82); ctx.lineTo(-cw * 0.3, 0);
  ctx.moveTo(cw * 0.2, -ch * 0.82); ctx.lineTo(cw * 0.2, 0);
  ctx.stroke();

  // 锈迹斑块
  ctx.fillStyle = 'rgba(180,100,40,0.3)';
  ctx.beginPath(); ctx.ellipse(-cw * 0.5, -ch * 0.4, cw * 0.15, ch * 0.12, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cw * 0.45, -ch * 0.6, cw * 0.12, ch * 0.1, -0.2, 0, Math.PI*2); ctx.fill();

  // === 后窗（防弹网格）===
  ctx.fillStyle = '#1a1a1a';
  roundRect(ctx, -cw * 0.45, -ch * 0.78, cw * 0.9, ch * 0.22, cw * 0.04); ctx.fill();
  // 网格
  ctx.strokeStyle = 'rgba(100,100,100,0.4)';
  ctx.lineWidth = Math.max(1, s * 1.5);
  for (let gx = -cw*0.4; gx < cw*0.4; gx += cw*0.12) {
    ctx.beginPath(); ctx.moveTo(gx, -ch*0.76); ctx.lineTo(gx, -ch*0.58); ctx.stroke();
  }
  for (let gy = -ch*0.72; gy < -ch*0.58; gy += ch*0.06) {
    ctx.beginPath(); ctx.moveTo(-cw*0.43, gy); ctx.lineTo(cw*0.43, gy); ctx.stroke();
  }
  // 裂纹
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-cw*0.2, -ch*0.75); ctx.lineTo(-cw*0.1, -ch*0.65); ctx.lineTo(-cw*0.15, -ch*0.6);
  ctx.stroke();

  // === 尾灯 ===
  const tailGlow = ctx.createRadialGradient(-cw*0.65, -ch*0.35, 0, -cw*0.65, -ch*0.35, cw*0.2);
  tailGlow.addColorStop(0, 'rgba(255,60,20,0.8)');
  tailGlow.addColorStop(1, 'rgba(255,60,20,0)');
  ctx.fillStyle = tailGlow;
  ctx.fillRect(-cw*0.9, -ch*0.55, cw*0.5, cw*0.4);
  ctx.fillStyle = '#ff3311';
  roundRect(ctx, -cw * 0.72, -ch * 0.4, cw * 0.18, ch * 0.12, 2); ctx.fill();
  const tailGlow2 = ctx.createRadialGradient(cw*0.65, -ch*0.35, 0, cw*0.65, -ch*0.35, cw*0.2);
  tailGlow2.addColorStop(0, 'rgba(255,60,20,0.8)');
  tailGlow2.addColorStop(1, 'rgba(255,60,20,0)');
  ctx.fillStyle = tailGlow2;
  ctx.fillRect(cw*0.4, -ch*0.55, cw*0.5, cw*0.4);
  ctx.fillStyle = '#ff3311';
  roundRect(ctx, cw * 0.54, -ch * 0.4, cw * 0.18, ch * 0.12, 2); ctx.fill();

  // 被陷阱减速时尾灯更亮
  if (slowTimer > 0 && player.speed > 1) {
    ctx.fillStyle = 'rgba(255,80,30,0.5)';
    roundRect(ctx, -cw * 0.72, -ch * 0.4, cw * 0.18, ch * 0.12, 2); ctx.fill();
    roundRect(ctx, cw * 0.54, -ch * 0.4, cw * 0.18, ch * 0.12, 2); ctx.fill();
  }

  // === 后保险杠（带尖刺）===
  ctx.fillStyle = '#2a2218';
  roundRect(ctx, -cw * 0.92, -ch * 0.18, cw * 1.84, ch * 0.18, cw * 0.04); ctx.fill();
  // 尖刺
  ctx.fillStyle = '#666';
  for (let sp = -3; sp <= 3; sp++) {
    const sx = sp * cw * 0.22;
    ctx.beginPath();
    ctx.moveTo(sx - cw*0.05, -ch*0.18);
    ctx.lineTo(sx, -ch*0.02);
    ctx.lineTo(sx + cw*0.05, -ch*0.18);
    ctx.closePath(); ctx.fill();
  }

  // === 排气管（两侧竖管）===
  const exhaustGlow = player.nitroActive ? 'rgba(255,150,50,0.6)' : 'rgba(100,100,100,0.3)';
  // 左排气管
  ctx.fillStyle = '#333';
  roundRect(ctx, -cw * 1.05, -ch * 0.65, cw * 0.14, ch * 0.5, cw * 0.05); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-cw * 0.98, -ch * 0.65, cw * 0.07, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = exhaustGlow;
  ctx.beginPath(); ctx.arc(-cw * 0.98, -ch * 0.65, cw * 0.04, 0, Math.PI*2); ctx.fill();
  // 右排气管
  ctx.fillStyle = '#333';
  roundRect(ctx, cw * 0.91, -ch * 0.65, cw * 0.14, ch * 0.5, cw * 0.05); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(cw * 0.98, -ch * 0.65, cw * 0.07, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = exhaustGlow;
  ctx.beginPath(); ctx.arc(cw * 0.98, -ch * 0.65, cw * 0.04, 0, Math.PI*2); ctx.fill();

  // === 车顶防滚架 + 备胎 ===
  ctx.strokeStyle = '#2a2218';
  ctx.lineWidth = Math.max(2, s * 5);
  ctx.beginPath();
  ctx.moveTo(-cw * 0.5, -ch * 0.82); ctx.lineTo(-cw * 0.5, -ch * 1.0);
  ctx.moveTo(cw * 0.5, -ch * 0.82); ctx.lineTo(cw * 0.5, -ch * 1.0);
  ctx.moveTo(-cw * 0.5, -ch * 1.0); ctx.lineTo(cw * 0.5, -ch * 1.0);
  ctx.stroke();
  // 备胎
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(0, -ch * 0.92, cw * 0.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.arc(0, -ch * 0.92, cw * 0.12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(0, -ch * 0.92, cw * 0.05, 0, Math.PI*2); ctx.fill();

  // === 车尾标识 ===
  ctx.fillStyle = 'rgba(255,200,100,0.6)';
  ctx.font = `bold ${Math.max(8, s*22)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText('BEAST', 0, -ch * 0.28);

  // 氮气加速时的尾焰（更亮更猛）
  if (player.nitroActive) {
    for (let ex = -1; ex <= 1; ex += 2) {
      const ex2 = ex * cw * 0.98;
      const flameLen = ch * (0.7 + Math.random() * 0.5);
      const fg = ctx.createRadialGradient(ex2, -ch*0.55, 0, ex2, -ch*0.55 + flameLen*0.35, flameLen*1.1);
      fg.addColorStop(0, 'rgba(255,200,70,0.95)');
      fg.addColorStop(0.4, 'rgba(255,110,15,0.75)');
      fg.addColorStop(1, 'rgba(255,50,0,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.ellipse(ex2, -ch*0.55 + flameLen*0.35, cw*0.3, flameLen*0.85, 0, 0, Math.PI*2);
      ctx.fill();
      // 蓝色内焰
      ctx.fillStyle = 'rgba(110,200,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(ex2, -ch*0.55 + flameLen*0.5, cw*0.12, flameLen*0.4, 0, 0, Math.PI*2);
      ctx.fill();
      // 白色炽热核心
      ctx.fillStyle = 'rgba(255,255,230,0.95)';
      ctx.beginPath();
      ctx.ellipse(ex2, -ch*0.55 + flameLen*0.55, cw*0.05, flameLen*0.18, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// ============================================================
//  渲染：道具
// ============================================================
function drawPickups() {
  const sorted = pickups.slice().sort((a, b) => b.z - a.z);
  for (const p of sorted) {
    const dz = p.z - player.z;
    if (dz < -1 || dz > RENDER_DIST) continue;
    const proj = project(p.x, 0, p.z);
    if (!proj) continue;
    const s = proj.scale;

    // 地面预警：进入反应距离内亮红圈闪烁（约 0.8 秒前）
    const warnLead = player.speed * 0.8;
    if (p.type !== 'nitro' && p.type !== 'ammo' && dz > 0 && dz < warnLead) {
      const pulse = 0.5 + 0.5 * Math.sin(p.flicker * 6);
      ctx.fillStyle = `rgba(255,30,10,${0.18 + 0.22 * pulse})`;
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y, s * 90, s * 24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,80,30,${0.5 + 0.3 * pulse})`;
      ctx.lineWidth = Math.max(2, s * 6);
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y, s * (90 + 14 * pulse), s * (24 + 4 * pulse), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 被车辆遮挡时头顶显示 ⚠
    if (p.type !== 'nitro' && p.type !== 'ammo' && isOccluded(p.x, p.z)) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(p.flicker * 5);
      ctx.fillStyle = '#ff2020';
      ctx.font = `bold ${Math.max(14, s * 70)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText('⚠', proj.x, proj.y - s * 130);
      ctx.globalAlpha = 1;
    }

    if (p.type === 'nitro') {
      const bw = s * 72, bh = s * 130;
      const glow = ctx.createRadialGradient(proj.x, proj.y - bh*0.5, 0, proj.x, proj.y - bh*0.5, bw*2.6);
      glow.addColorStop(0, 'rgba(255,150,20,0.75)');
      glow.addColorStop(1, 'rgba(255,120,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(proj.x - bw*2.6, proj.y - bh*2.6, bw*5.2, bh*2.6);
      ctx.fillStyle = '#ff6600';
      roundRect(ctx, proj.x - bw/2, proj.y - bh, bw, bh*0.85, bw*0.3); ctx.fill();
      ctx.fillStyle = '#ffaa44';
      roundRect(ctx, proj.x - bw*0.3, proj.y - bh*0.9, bw*0.6, bh*0.3, bw*0.15); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.fillRect(proj.x - bw*0.2, proj.y - bh*1.05, bw*0.4, bh*0.15);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(10, s*38)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText('N₂', proj.x, proj.y - bh*0.45);
    }
    else if (p.type === 'spike') {
      const blink = p.life < 3 ? (Math.sin(p.flicker*3) > 0 ? 1 : 0.35) : 1;
      const sw = s * 34;
      // 冷光光晕
      const glow = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, sw*2.6);
      glow.addColorStop(0, `rgba(210,230,255,${0.55 * blink})`);
      glow.addColorStop(1, 'rgba(160,190,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(proj.x, proj.y, sw*2.6, 0, Math.PI*2); ctx.fill();
      // 尖刺
      ctx.fillStyle = `rgba(235,242,255,${blink})`;
      for (let i = -2; i <= 2; i++) {
        const sx = proj.x + i * sw * 1.35;
        ctx.beginPath();
        ctx.moveTo(sx, proj.y - sw*1.6);
        ctx.lineTo(sx - sw*0.6, proj.y + sw*0.25);
        ctx.lineTo(sx + sw*0.6, proj.y + sw*0.25);
        ctx.closePath(); ctx.fill();
        // 红色尖端
        ctx.fillStyle = `rgba(255,70,50,${blink})`;
        ctx.beginPath();
        ctx.moveTo(sx, proj.y - sw*1.6);
        ctx.lineTo(sx - sw*0.25, proj.y - sw*0.9);
        ctx.lineTo(sx + sw*0.25, proj.y - sw*0.9);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(235,242,255,${blink})`;
      }
      ctx.fillStyle = `rgba(120,132,165,${blink*0.85})`;
      ctx.fillRect(proj.x - sw*3.8, proj.y - 3, sw*7.6, 6);
    }
    else if (p.type === 'fire') {
      const flick = Math.sin(p.flicker) * 0.25 + 0.75;
      const fh = s * 190 * flick, fw = s * 115;
      const fy = proj.y - fh * 0.3;
      // 大范围热浪光晕
      const glow = ctx.createRadialGradient(proj.x, fy, 0, proj.x, fy, fw * 1.9);
      glow.addColorStop(0, 'rgba(255,170,40,0.65)');
      glow.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(proj.x, fy, fw * 1.9, 0, Math.PI * 2); ctx.fill();
      // 三条火舌
      for (let i = -1; i <= 1; i++) {
        const fx = proj.x + i * fw * 0.72;
        const fw2 = fw * (i === 0 ? 0.75 : 0.5);
        ctx.fillStyle = i === 0 ? 'rgba(255,120,15,0.95)' : 'rgba(255,80,10,0.85)';
        ctx.beginPath();
        ctx.moveTo(fx, proj.y + fh*0.1);
        ctx.quadraticCurveTo(fx + fw2, proj.y - fh*0.1, fx + fw2*0.35, proj.y - fh*0.55);
        ctx.quadraticCurveTo(fx + fw2*0.1, proj.y - fh, fx, proj.y - fh*0.9);
        ctx.quadraticCurveTo(fx - fw2*0.1, proj.y - fh, fx - fw2*0.35, proj.y - fh*0.55);
        ctx.quadraticCurveTo(fx - fw2, proj.y - fh*0.1, fx, proj.y + fh*0.1);
        ctx.closePath(); ctx.fill();
      }
      // 亮黄内核
      ctx.fillStyle = 'rgba(255,240,150,0.95)';
      ctx.beginPath();
      ctx.moveTo(proj.x, proj.y + fh*0.08);
      ctx.quadraticCurveTo(proj.x + fw*0.3, proj.y - fh*0.2, proj.x, proj.y - fh*0.5);
      ctx.quadraticCurveTo(proj.x - fw*0.3, proj.y - fh*0.2, proj.x, proj.y + fh*0.08);
      ctx.closePath(); ctx.fill();
    }
    else if (p.type === 'ammo') {
      const bw = s * 84, bh = s * 84;
      const glow = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, bw*2);
      glow.addColorStop(0, 'rgba(80,255,120,0.7)');
      glow.addColorStop(1, 'rgba(40,220,80,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(proj.x - bw*2, proj.y - bw*2, bw*4, bw*4);
      ctx.fillStyle = '#2a5a2a';
      roundRect(ctx, proj.x - bw/2, proj.y - bh/2, bw, bh, bw*0.15); ctx.fill();
      ctx.fillStyle = '#4a8a4a';
      roundRect(ctx, proj.x - bw*0.38, proj.y - bh*0.38, bw*0.76, bh*0.76, bw*0.12); ctx.fill();
      ctx.fillStyle = '#c8ffc8';
      ctx.font = `bold ${Math.max(12, s*46)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText('M', proj.x, proj.y + bh*0.18);
      ctx.fillStyle = '#2a5a2a';
      ctx.fillRect(proj.x - bw*0.3, proj.y + bh*0.75, bw*0.6, bh*0.12);
    }
    else if (p.type === 'shield') {
      const bw = s * 82, bh = s * 90;
      const glow = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, bw*2);
      glow.addColorStop(0, 'rgba(120,200,255,0.7)');
      glow.addColorStop(1, 'rgba(60,150,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(proj.x - bw*2, proj.y - bw*2, bw*4, bw*4);
      // 蓝色盾牌
      ctx.fillStyle = '#1a4a8a';
      ctx.beginPath();
      ctx.moveTo(proj.x, proj.y - bh/2);
      ctx.quadraticCurveTo(proj.x + bw/2, proj.y - bh/4, proj.x + bw/2, proj.y);
      ctx.quadraticCurveTo(proj.x + bw/2, proj.y + bh/3, proj.x, proj.y + bh/2);
      ctx.quadraticCurveTo(proj.x - bw/2, proj.y + bh/3, proj.x - bw/2, proj.y);
      ctx.quadraticCurveTo(proj.x - bw/2, proj.y - bh/4, proj.x, proj.y - bh/2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#cfe8ff';
      ctx.lineWidth = Math.max(2, s * 6);
      ctx.stroke();
      ctx.fillStyle = '#cfe8ff';
      ctx.font = `bold ${Math.max(12, s * 42)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText('S', proj.x, proj.y + bh*0.16);
    }
    else if (p.type === 'medkit') {
      const bw = s * 78, bh = s * 62;
      const glow = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, bw*2);
      glow.addColorStop(0, 'rgba(255,150,150,0.7)');
      glow.addColorStop(1, 'rgba(255,80,80,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(proj.x - bw*2, proj.y - bw*2, bw*4, bw*4);
      // 白色急救箱 + 红十字
      ctx.fillStyle = '#f0f0f0';
      roundRect(ctx, proj.x - bw/2, proj.y - bh/2, bw, bh, bw*0.14); ctx.fill();
      ctx.fillStyle = '#d22';
      roundRect(ctx, proj.x - bw*0.08, proj.y - bh*0.38, bw*0.16, bh*0.76, bw*0.04); ctx.fill();
      roundRect(ctx, proj.x - bw*0.38, proj.y - bh*0.08, bw*0.76, bh*0.16, bw*0.04); ctx.fill();
    }

  }
}

// ============================================================
//  渲染：粒子
// ============================================================
function drawParticles() {
  const sorted = particles.slice().sort((a, b) => b.z - a.z);
  for (const p of sorted) {
    const dz = p.z - player.z;
    if (dz < -2 || dz > RENDER_DIST) continue;
    const proj = project(p.x, p.y, p.z);
    if (!proj) continue;
    const alpha = clamp(p.life / p.maxLife, 0, 1);

    if (p.type === 'text') {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.font = `bold ${Math.max(14, proj.scale * 60)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, proj.x, proj.y);
      ctx.globalAlpha = 1;
      continue;
    }

    const size = p.size * proj.scale * 3;
    if (p.type === 'flame') {
      ctx.globalAlpha = alpha;
      const glow = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, size);
      glow.addColorStop(0, '#fff8d0');
      glow.addColorStop(0.35, p.color);
      glow.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(proj.x, proj.y, size, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      continue;
    }
    if (p.type === 'smoke' || p.type === 'dust') {
      ctx.globalAlpha = alpha * 0.4;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(proj.x, proj.y, size, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(proj.x, proj.y, Math.max(1, size*0.3), 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

// ============================================================
//  渲染：BOSS 巨型战车
// ============================================================
function drawBoss() {
  if (!boss || bossDefeated) return;
  const dz = boss.z - player.z;
  if (dz < -3 || dz > RENDER_DIST) return;
  const p = project(boss.x, 0, boss.z);
  if (!p) return;
  const s = p.scale;
  const w = s * 540 * boss.sizeMul, h = s * 320 * boss.sizeMul;
  ctx.save();
  ctx.translate(p.x, p.y);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0, 6, w * 0.52, h * 0.14, 0, 0, Math.PI * 2); ctx.fill();

  // 主体（车尾视角的巨型装甲卡车）
  const bodyGrad = ctx.createLinearGradient(-w * 0.5, -h, w * 0.5, 0);
  if (boss.stage === 2) {
    bodyGrad.addColorStop(0, '#2a0a16');
    bodyGrad.addColorStop(0.5, '#551030');
    bodyGrad.addColorStop(1, '#160508');
  } else {
    bodyGrad.addColorStop(0, '#3a0d08');
    bodyGrad.addColorStop(0.5, '#6a1508');
    bodyGrad.addColorStop(1, '#2a0804');
  }
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, -w * 0.48, -h * 0.78, w * 0.96, h * 0.78, w * 0.06); ctx.fill();
  // 装甲拼接线
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = Math.max(1, s * 3);
  ctx.beginPath();
  ctx.moveTo(-w * 0.2, -h * 0.78); ctx.lineTo(-w * 0.2, 0);
  ctx.moveTo(w * 0.18, -h * 0.78); ctx.lineTo(w * 0.18, 0);
  ctx.stroke();
  // 尖刺保险杠
  ctx.fillStyle = '#1f1a12';
  roundRect(ctx, -w * 0.52, -h * 0.16, w * 1.04, h * 0.16, w * 0.03); ctx.fill();
  ctx.fillStyle = '#9a9a9a';
  for (let sp = -4; sp <= 4; sp++) {
    const sx = sp * w * 0.11;
    ctx.beginPath();
    ctx.moveTo(sx - w * 0.03, -h * 0.16);
    ctx.lineTo(sx, 0);
    ctx.lineTo(sx + w * 0.03, -h * 0.16);
    ctx.closePath(); ctx.fill();
  }
  // 巨型轮胎（后侧可见四轮）
  ctx.fillStyle = '#0d0d0d';
  for (let tx = -1; tx <= 1; tx += 2) {
    roundRect(ctx, tx * w * 0.42 - w * 0.1, -h * 0.5, w * 0.2, h * 0.5, w * 0.04); ctx.fill();
    roundRect(ctx, tx * w * 0.42 - w * 0.1, -h * 1.0, w * 0.2, h * 0.28, w * 0.04); ctx.fill();
  }
  // 炮塔（炮管朝向玩家）
  ctx.fillStyle = '#26201a';
  roundRect(ctx, -w * 0.14, -h * 1.28, w * 0.28, h * 0.3, w * 0.05); ctx.fill();
  ctx.save();
  ctx.translate(0, -h * 1.28);
  ctx.rotate((player.x - boss.x) * 0.8);
  ctx.fillStyle = '#1a1410';
  roundRect(ctx, -w * 0.09, -h * 0.5, w * 0.18, h * 0.55, w * 0.04); ctx.fill();
  ctx.fillStyle = '#ff4400';
  ctx.beginPath(); ctx.arc(0, -h * 0.5, w * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 排气火焰
  ctx.fillStyle = 'rgba(255,140,30,0.7)';
  for (let ex = -1; ex <= 1; ex += 2) {
    ctx.beginPath();
    ctx.ellipse(ex * w * 0.3, h * 0.06, w * 0.07, h * 0.12 * (1 + Math.random() * 0.5), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // BOSS 标识
  ctx.fillStyle = 'rgba(255,60,20,0.85)';
  if (boss.stage === 2) ctx.fillStyle = 'rgba(255,90,220,0.9)';
  ctx.font = `bold ${Math.max(12, s * 30)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(boss.stage === 2 ? 'BOSS-2' : 'BOSS', 0, -h * 0.3);

  // 受击闪白
  if (boss.flash > 0) {
    ctx.globalAlpha = clamp(boss.flash * 4, 0, 0.6);
    ctx.fillStyle = '#fff';
    roundRect(ctx, -w * 0.48, -h * 0.78, w * 0.96, h * 0.78, w * 0.06); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 血条（BOSS 上方）
  const bw = s * 520;
  const bh = Math.max(8, s * 22);
  const bx = p.x - bw / 2, by = p.y - s * 460 - bh;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, bx - 4, by - 20, bw + 8, bh + 26, 6); ctx.fill();
  ctx.fillStyle = '#ff2200';
  ctx.font = `bold ${Math.max(11, s * 24)}px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(boss.stage === 2 ? 'BOSS 战车 II' : 'BOSS 战车', p.x, by - 6);
  ctx.fillStyle = '#3a0800';
  roundRect(ctx, bx, by, bw, bh, 4); ctx.fill();
  const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
  if (ratio > 0) {
    const bg2 = ctx.createLinearGradient(bx, by, bx + bw, by);
    if (boss.stage === 2) { bg2.addColorStop(0, '#d020c0'); bg2.addColorStop(1, '#ff6600'); }
    else { bg2.addColorStop(0, '#ff2200'); bg2.addColorStop(1, '#ff8800'); }
    ctx.fillStyle = bg2;
    roundRect(ctx, bx, by, bw * ratio, bh, 4); ctx.fill();
  }
}

// ============================================================
//  渲染：玩家护盾光罩
// ============================================================
function drawShield() {
  if (shield <= 0 || gameMode !== 'boss') return;
  const p = project(player.x, 0, player.z);
  if (!p) return;
  const s = p.scale;
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.008);
  ctx.save();
  ctx.translate(p.x, p.y - s * 26);
  const rx = s * 160, ry = s * 96;
  ctx.fillStyle = `rgba(80,160,255,${0.10 + 0.07 * pulse})`;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(140,200,255,${0.55 + 0.3 * pulse})`;
  ctx.lineWidth = Math.max(2, s * 6);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ============================================================
//  渲染：Boss 弹道预警（发射前 0.7 秒高亮目标车道）
// ============================================================
function drawBossAim() {
  if (!boss || !boss.aimLanes || boss.aimLanes.length === 0 || boss.warnTimer <= 0) return;
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.02);
  const z0 = boss.z - 2.0, z1 = player.z - 1.0;
  for (const a of boss.aimLanes) {
    const type = a.type || 'volley';
    const cx = -ROAD_HALF + LANE_W * (a.lane + 0.5);
    const p0 = project(cx, 0, z0);
    const p1 = project(cx, 0, z1);
    if (!p0 || !p1) continue;
    // 车道光带（volley 红 / homing 紫 / beam 蓝白）
    let band, dash, mark, markColor;
    if (type === 'beam') { band = `rgba(110,170,255,${0.2 + 0.28 * pulse})`; dash = `rgba(210,240,255,${0.6 + 0.4 * pulse})`; mark = '⚡'; markColor = 'rgba(220,245,255,'; }
    else if (type === 'homing') { band = `rgba(220,80,255,${0.2 + 0.26 * pulse})`; dash = `rgba(255,170,255,${0.6 + 0.4 * pulse})`; mark = '⚠'; markColor = 'rgba(255,190,255,'; }
    else { band = `rgba(255,40,10,${0.15 + 0.22 * pulse})`; dash = `rgba(255,220,90,${0.55 + 0.4 * pulse})`; mark = '⚠'; markColor = 'rgba(255,230,120,'; }
    ctx.strokeStyle = band;
    ctx.lineWidth = Math.max(4, p0.scale * 300);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    // 中心虚线（闪烁）
    ctx.strokeStyle = dash;
    ctx.lineWidth = Math.max(2, p0.scale * 9);
    ctx.setLineDash([22, 18]);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    ctx.setLineDash([]);
    // 车道中段标记
    const pm = project(cx, 0, (z0 + z1) / 2);
    if (pm) {
      ctx.fillStyle = markColor + (0.7 + 0.3 * pulse) + ')';
      ctx.font = `bold ${Math.max(18, pm.scale * 64)}px Courier New`;
      ctx.textAlign = 'center';
      ctx.fillText(mark, pm.x, pm.y);
    }
  }
}

// ============================================================
//  渲染：第二关激光封锁柱
// ============================================================
function drawBeams() {
  for (const bm of beams) {
    const cx = -ROAD_HALF + LANE_W * (bm.lane + 0.5);
    const p0 = project(cx, 0, bm.z0);
    const p1 = project(cx, 0, bm.z1);
    if (!p0 || !p1) continue;
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.03);
    // 外层红色光柱
    ctx.strokeStyle = `rgba(255,60,30,${0.16 + 0.14 * pulse})`;
    ctx.lineWidth = Math.max(6, p0.scale * 340);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    // 内芯亮白
    ctx.strokeStyle = `rgba(255,235,210,${0.7 + 0.3 * pulse})`;
    ctx.lineWidth = Math.max(3, p0.scale * 24);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    // 顶端光点
    ctx.fillStyle = `rgba(255,240,220,${0.8 + 0.2 * pulse})`;
    ctx.beginPath(); ctx.arc(p0.x, p0.y, Math.max(4, p0.scale * 40), 0, Math.PI * 2); ctx.fill();
  }
}

// ============================================================
//  渲染：Boss 子弹 / 玩家导弹
// ============================================================
function drawBullets() {
  for (const b of bullets) {
    const dz = b.z - player.z;
    if (dz < -2 || dz > RENDER_DIST) continue;
    const p = project(b.x, 0, b.z);
    if (!p) continue;
    const s = p.scale;
    // 弹道轨道线：沿车道中心延伸，安全范围一目了然
    const p2 = project(b.x, 0, b.z + 16);
    if (p2) {
      ctx.strokeStyle = 'rgba(255,70,15,0.3)';
      ctx.lineWidth = Math.max(1, s * 10);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s * 60);
    glow.addColorStop(0, 'rgba(255,220,120,0.95)');
    glow.addColorStop(0.4, 'rgba(255,120,20,0.8)');
    glow.addColorStop(1, 'rgba(255,40,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, p.y, s * 60, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3c0';
    ctx.beginPath(); ctx.arc(p.x, p.y, s * 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,150,40,0.5)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + s * 40, s * 10, s * 26, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMissiles() {
  for (const m of missiles) {
    const dz = m.z - player.z;
    if (dz < -2 || dz > RENDER_DIST) continue;
    const p = project(m.x, 0, m.z);
    if (!p) continue;
    const s = p.scale;
    const w = s * 36, h = s * 110;
    ctx.save();
    ctx.translate(p.x, p.y);
    const fg = ctx.createRadialGradient(0, h * 0.6, 0, 0, h * 0.6, h * 0.9);
    fg.addColorStop(0, 'rgba(255,230,140,0.95)');
    fg.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.ellipse(0, h * 0.6, w * 0.6, h * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8d8d8';
    roundRect(ctx, -w * 0.4, -h * 0.6, w * 0.8, h * 1.1, w * 0.4); ctx.fill();
    ctx.fillStyle = '#ff3300';
    roundRect(ctx, -w * 0.4, -h * 0.6, w * 0.8, h * 0.35, w * 0.4); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(-w * 0.4, h * 0.4); ctx.lineTo(-w * 1.0, h * 0.9); ctx.lineTo(-w * 0.4, h * 0.55); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w * 0.4, h * 0.4); ctx.lineTo(w * 1.0, h * 0.9); ctx.lineTo(w * 0.4, h * 0.55); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ============================================================
//  渲染：沙尘暴
// ============================================================
function drawSandstorm() {
  ctx.fillStyle = '#d4a868';
  for (const g of sandGrains) {
    ctx.globalAlpha = g.alpha * stormIntensity;
    ctx.fillRect(g.x, g.y, g.size, g.size * 0.5);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = `rgba(200,160,90,${stormIntensity * 0.12})`;
  ctx.fillRect(0, 0, RW, RH);

  // 氮气速度线（更亮更多）
  if (player.nitroActive && player.speed > 10) {
    ctx.strokeStyle = 'rgba(255,200,90,0.5)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 40; i++) {
      const ang = (i / 40) * Math.PI * 2;
      const r1 = 170 + Math.sin(Date.now()*0.015 + i) * 70;
      const r2 = r1 + 150;
      ctx.beginPath();
      ctx.moveTo(RW/2 + Math.cos(ang)*r1, HORIZON + Math.sin(ang)*r1*0.5);
      ctx.lineTo(RW/2 + Math.cos(ang)*r2, HORIZON + Math.sin(ang)*r2*0.5);
      ctx.stroke();
    }
    // 边缘橙红光晕
    const vg = ctx.createRadialGradient(RW/2, RH*0.55, RH*0.15, RW/2, RH*0.55, RH*0.85);
    vg.addColorStop(0, 'rgba(255,150,40,0)');
    vg.addColorStop(1, 'rgba(255,120,20,' + (0.3 * nitroFlash) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, RW, RH);
  } else if (nitroFlash > 0) {
    const vg = ctx.createRadialGradient(RW/2, RH*0.55, RH*0.15, RW/2, RH*0.55, RH*0.85);
    vg.addColorStop(0, 'rgba(255,150,40,0)');
    vg.addColorStop(1, 'rgba(255,120,20,' + (0.25 * nitroFlash) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, RW, RH);
  }

  if (slowTimer > 0) {
    const grad = ctx.createRadialGradient(RW/2, RH/2, RH*0.3, RW/2, RH/2, RH*0.7);
    grad.addColorStop(0, 'rgba(255,0,0,0)');
    grad.addColorStop(1, `rgba(255,50,0,${0.3 * (slowTimer/2)})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, RW, RH);
  }
}

// ============================================================
//  渲染：HUD（叠加层）
// ============================================================
function drawHUD() {
  // 分数（右上角）
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(ctx, RW - 260, 20, 230, 40, 8); ctx.fill();
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 22px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText('SCORE ' + Math.floor(score), RW - 42, 48);

  // 计时模式倒计时（分数下方）
  if (gameMode === 'timed') {
    const m = Math.floor(timeLeft / 60);
    const s = Math.floor(timeLeft % 60);
    const tStr = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    const danger = timeLeft <= 30;
    const blink = danger && Math.floor(Date.now() / 400) % 2 === 0;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, RW - 240, 66, 210, 42, 8); ctx.fill();
    ctx.fillStyle = blink ? '#ff2200' : (danger ? '#ff8800' : '#66ddff');
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('TIME ' + tStr, RW - 135, 98);
  }

  // 距离
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(ctx, 30, 20, 160, 35, 6); ctx.fill();
  ctx.fillStyle = '#aaddaa';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('DIST ' + Math.floor(distance) + 'm', 42, 44);

  // 车道指示
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(ctx, 30, 62, 160, 28, 6); ctx.fill();
  ctx.fillStyle = '#88ccff';
  ctx.font = 'bold 13px Courier New';
  ctx.fillText('LANE ' + (player.targetLane + 1) + '/' + LANES, 42, 82);

  // 模式
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(ctx, 30, 97, 160, 24, 6); ctx.fill();
  ctx.fillStyle = gameMode === 'timed' ? '#ffbb55' : (gameMode === 'boss' ? '#ff5544' : '#88ffaa');
  ctx.font = 'bold 12px Courier New';
  ctx.fillText(gameMode === 'timed' ? 'MODE: 计时' : (gameMode === 'boss' ? 'MODE: BOSS' : 'MODE: 无尽'), 42, 114);

  // BOSS 血条 + 导弹数（顶部居中）
  if (gameMode === 'boss' && boss) {
    const bw = 380, bh = 18;
    const bx = RW/2 - bw/2, by = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(ctx, bx - 6, by - 24, bw + 12, bh + 30, 8); ctx.fill();
    ctx.fillStyle = '#ff4422';
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(boss.stage === 2 ? 'BOSS 战车 II' : 'BOSS 战车', RW/2, by - 5);
    ctx.fillStyle = '#3a0800';
    roundRect(ctx, bx, by, bw, bh, 5); ctx.fill();
    const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
    if (ratio > 0) {
      const bg = ctx.createLinearGradient(bx, by, bx+bw, by);
      if (boss.stage === 2) { bg.addColorStop(0, '#d020c0'); bg.addColorStop(1, '#ff6600'); }
      else { bg.addColorStop(0, '#ff2200'); bg.addColorStop(1, '#ff8800'); }
      ctx.fillStyle = bg;
      roundRect(ctx, bx, by, bw*ratio, bh, 5); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, RW/2 - 80, 58, 160, 26, 6); ctx.fill();
    ctx.fillStyle = '#88ff88';
    ctx.font = 'bold 14px Courier New';
    ctx.fillText('导弹 x' + missileStock, RW/2, 78);
  }



  // 玩家生命（BOSS 模式，左上角 MODE 下方）
  if (gameMode === 'boss') {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(ctx, 30, 128, 160, 28, 6); ctx.fill();
    ctx.fillStyle = player.invuln > 0 && Math.floor(Date.now()/150) % 2 === 0 ? '#666' : '#ff3355';
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('生命 ' + '♥'.repeat(Math.max(0, player.hp)) + '♡'.repeat(Math.max(0, 3 - player.hp)), 42, 148);
    // 护盾层数
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(ctx, 30, 158, 160, 26, 6); ctx.fill();
    ctx.fillStyle = shield > 0 ? '#66ccff' : '#446688';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('护盾 ' + '◆'.repeat(shield) + '◇'.repeat(Math.max(0, 2 - shield)), 42, 177);
  }

  // 连击（计时器下方）
  if (combo > 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(ctx, RW - 240, 116, 210, 35, 6); ctx.fill();
    ctx.fillStyle = '#ff6644';
    ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('COMBO x' + combo, RW - 42, 141);
  }

  // 氮气表（左下）
  drawNitroMeter(40, RH - 70, 160, 22);

  // 速度表（右下）
  drawSpeedometer(RW - 90, RH - 85, 52);

  // 减速警告
  if (slowTimer > 0) {
    ctx.fillStyle = '#ff4422';
    ctx.font = 'bold 28px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('减速中!', RW/2, RH*0.4);
  }

  // 静音
  if (muted) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '12px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('[MUTED]', RW - 30, RH - 100);
  }
}

function drawSpeedometer(cx, cy, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#4a3e30'; ctx.lineWidth = 3; ctx.stroke();

  const speedRatio = clamp(player.speed / NITRO_MAX_SPEED, 0, 1);
  const startAng = Math.PI * 0.75, endAng = Math.PI * 2.25;
  ctx.strokeStyle = '#6a5a48'; ctx.lineWidth = 2;
  for (let i = 0; i <= 10; i++) {
    const ang = startAng + (endAng - startAng) * (i/10);
    const inner = i % 2 === 0 ? r*0.7 : r*0.8;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang)*inner, cy + Math.sin(ang)*inner);
    ctx.lineTo(cx + Math.cos(ang)*r*0.9, cy + Math.sin(ang)*r*0.9);
    ctx.stroke();
  }

  ctx.strokeStyle = player.nitroActive ? '#ff6600' : '#ffaa00';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, cy, r*0.75, startAng, startAng + (endAng-startAng)*speedRatio);
  ctx.stroke();

  const needleAng = startAng + (endAng - startAng) * speedRatio;
  ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(needleAng)*r*0.65, cy + Math.sin(needleAng)*r*0.65);
  ctx.stroke();

  ctx.fillStyle = '#3a2e22';
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ddd';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(Math.round(player.speed * 15), cx, cy + r + 16);
  ctx.font = '9px Courier New';
  ctx.fillStyle = '#888';
  ctx.fillText('KM/H', cx, cy + r + 28);
}

function drawNitroMeter(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(ctx, x, y, w, h, 4); ctx.fill();
  ctx.strokeStyle = '#4a3e30'; ctx.lineWidth = 2; ctx.stroke();

  const ratio = player.nitro / NITRO_MAX;
  if (ratio > 0) {
    const ng = ctx.createLinearGradient(x, y, x+w, y);
    ng.addColorStop(0, '#ff4400');
    ng.addColorStop(0.5, '#ff8800');
    ng.addColorStop(1, '#ffcc00');
    ctx.fillStyle = ng;
    roundRect(ctx, x+2, y+2, (w-4)*ratio, h-4, 3); ctx.fill();
  }

  ctx.fillStyle = player.nitroActive ? '#ffcc00' : '#ccc';
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('NITRO ' + Math.round(player.nitro) + '%', x, y - 6);

  if (player.nitroActive) {
    ctx.fillStyle = '#ff6600';
    ctx.font = 'bold 10px Courier New';
    ctx.fillText('BOOST!', x + w + 8, y + h/2 + 4);
  }
}

// ============================================================
//  BOSS 战斗逻辑
// ============================================================
function updateBoss(dt) {
  if (!boss || bossDefeated) return;
  if (boss.flash > 0) boss.flash -= dt;
  const distToBoss = boss.z - player.z;
  // Boss 固定在玩家前方固定距离（24m 与初始一致）：与玩家同速前进 + 差距平滑收敛（不贴脸、不超越）
  const gap = 24;
  const targetZ = player.z + gap;
  boss.z += player.speed * dt;
  boss.z += (targetZ - boss.z) * Math.min(1, dt * 2.5);
  boss.speed = player.speed * boss.chase;
  boss.wob += dt * 2;
  boss.x += (player.x - boss.x) * dt * boss.steer;
  boss.x = clamp(boss.x, -ROAD_HALF + LANE_W * 0.6, ROAD_HALF - LANE_W * 0.6);

  // 第二关专属：激光封锁（每 4.5~6 秒锁 2 条车道，预警后生成 2 秒激光柱）
  if (boss.stage === 2) {
    boss.beamTimer -= dt;
    if (boss.beamTimer <= 0 && boss.warnTimer <= 0) {
      const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
      boss.aimLanes = lanes.slice(0, 2).map(l => ({ lane: l, type: 'beam' }));
      boss.warnTimer = 0.8;
      boss.beamTimer = rand(4.5, 6);
    }
  }

  // 齐射预警（血量越低越猛）：先高亮预警目标车道，再发射
  boss.fireTimer -= dt;
  if (boss.fireTimer <= 0 && boss.warnTimer <= 0) {
    const shots = boss.stage === 2 ? 3 : (boss.hp / boss.maxHp < 0.5 ? 3 : 2);
    const lanePool = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    // 第二关第一发为追踪弹（紫色预警）
    boss.aimLanes = lanePool.slice(0, shots).map((l, i) => ({
      lane: l, type: boss.stage === 2 && i === 0 ? 'homing' : 'volley'
    }));
    boss.warnTimer = boss.warnTime;
  }
  if (boss.warnTimer > 0) {
    boss.warnTimer -= dt;
    if (boss.warnTimer <= 0) {
      const rage = 1 + (1 - boss.hp / boss.maxHp) * 1.4;
      const baseFire = boss.stage === 2 ? 1.8 : 2.4;
      boss.fireTimer = clamp(baseFire / rage, boss.stage === 2 ? 0.6 : 0.75, baseFire) * rand(0.85, 1.15);
      const aims = boss.aimLanes;
      boss.aimLanes = [];
      for (const a of aims) {
        if (a.type === 'beam') {
          beams.push({ lane: a.lane, z0: boss.z - 3, z1: player.z - 1, timer: 2, total: 2 });
        } else {
          bullets.push({
            x: -ROAD_HALF + LANE_W * (a.lane + 0.5),
            z: boss.z - 2.4,
            v: (boss.stage === 2 ? 20 : 16) + player.speed * (boss.stage === 2 ? 0.22 : 0.18),
            homing: a.type === 'homing'
          });
        }
      }
      playShoot();
    }
  }

  // 激光柱：计时 + 伤害（站进被封锁的车道即受伤）
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.timer -= dt;
    if (bm.timer <= 0) { beams.splice(i, 1); continue; }
    const cx = -ROAD_HALF + LANE_W * (bm.lane + 0.5);
    if (player.invuln <= 0 && player.z > bm.z0 - 0.3 && player.z < bm.z1 + 0.5 && Math.abs(player.x - cx) < 0.35) {
      hitPlayer(1);
    }
  }

  // 子弹飞行与命中（第二关追踪弹会拐弯追玩家）
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.z -= b.v * dt;
    if (b.homing) b.x += (player.x - b.x) * dt * 1.2;
    if (b.z < player.z - 2) { bullets.splice(i, 1); continue; }
    if (player.invuln <= 0 && Math.abs(b.x - player.x) < 0.3 && b.z > player.z - 0.5 && b.z < player.z + 0.7) {
      bullets.splice(i, 1);
      hitPlayer(1);
    }
  }

  // 导弹飞行与命中（拦截子弹后剩余的导弹继续追击 Boss）
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    m.x += (boss.x - m.x) * dt * 2.2;
    m.z += 55 * dt;
    if (m.z > boss.z + 3 || m.z - player.z > RENDER_DIST) { missiles.splice(i, 1); continue; }
    if (Math.abs(m.x - boss.x) < 1.35 && Math.abs(m.z - boss.z) < 2.2) {
      missiles.splice(i, 1);
      boss.hp -= 5; boss.flash = 0.25; score += 200;
      spawnExplosion(boss.x, boss.z, true);
      playBoom(); shakeDecay = Math.max(shakeDecay, 0.35);
      if (boss.hp <= 0) bossDefeatedFlow();
    }
  }

  // 导弹拦截子弹：导弹飞过子弹的路径即互相抵消（穿帧检测，低帧率也不漏）
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    const sweepZ0 = m.z - 55 * dt - 0.5;   // 本帧导弹扫过的 z 范围
    const sweepZ1 = m.z + 0.5;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.abs(m.x - b.x) < 0.45 && b.z >= sweepZ0 && b.z <= sweepZ1) {
        bullets.splice(j, 1);
        missiles.splice(i, 1);
        for (let k = 0; k < 8; k++) {
          particles.push({ x: (m.x + b.x) / 2, y: rand(0.2, 0.8), z: (m.z + b.z) / 2, vx: rand(-3, 3), vy: rand(2, 6), vz: rand(-3, 3), life: 0.4, maxLife: 0.4, size: rand(3, 6), color: pick(['#ffcc66', '#ff8844', '#ffffff']), type: 'spark' });
        }
        break;
      }
    }
  }

  // 撞击 boss（伤敌一千自损八百）
  if (player.invuln <= 0 && distToBoss < 1.8 && Math.abs(boss.x - player.x) < 0.75) {
    hitPlayer(1);
    boss.hp -= 2; boss.flash = 0.2;
    player.speed *= 0.45;
    if (boss.hp <= 0) bossDefeatedFlow();
  }
}

// Boss 被击毁：第一关 → 第二关过渡；第二关 → 通关
function bossDefeatedFlow() {
  boss.hp = 0;
  spawnExplosion(boss.x, boss.z, true); spawnExplosion(boss.x + 0.7, boss.z, true);
  if (boss.stage === 1) {
    stageBanner = 2.2;          // 第二关横幅
    boss = null;
    beams = [];
    bullets = [];
    player.hp = 3;              // 回满生命
    player.invuln = 1.5;
    shakeDecay = 0.8;
    playBoom();
  } else {
    bossDefeated = true;
    shakeDecay = 0.9;
    playBoom();
    gameState = 'gameover';
  }
}

function hitPlayer(dmg) {
  // 护盾：挡下一次伤害，破碎特效
  if (shield > 0) {
    shield--;
    player.invuln = 0.6;
    shakeDecay = Math.max(shakeDecay, 0.3);
    playBoom();
    spawnExplosion(player.x, player.z, false);
    for (let j = 0; j < 12; j++) {
      particles.push({ x: player.x + rand(-0.5, 0.5), y: rand(0.2, 0.8), z: player.z + rand(-0.5, 0.5), vx: rand(-3, 3), vy: rand(2, 6), vz: rand(-3, 3), life: 0.5, maxLife: 0.5, size: rand(3, 7), color: pick(['#66ccff', '#3399ff', '#aaddff']), type: 'spark' });
    }
    return;
  }
  player.hp -= dmg;
